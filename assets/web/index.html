<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080e15">
  <meta name="description" content="Transfiere archivos entre tu celular y tu PC por la red local, sin cable y sin nube.">
  <meta name="robots" content="noindex, nofollow">
  <title>FileFly</title>
  <link rel="icon" type="image/png" href="/icon-256.png">
  <link rel="apple-touch-icon" href="/icon-256.png">
  <!-- Without a manifest, "add to home screen" saves a screenshot of the
       page as the icon instead of the logo. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    /* Paleta. Se inyecta desde lib/app/palette.dart al arrancar, para que esta
       página y la ventana de escritorio no puedan separarse nunca. */
    :root{/*__FILEFLY_TOKENS__*/}

    :root{
      /* Escala de espaciado, base de 4px. Nada en este archivo usa un hueco
         fuera de escala. */
      --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
      /* Radios de esquina: los contenedores más suaves que los controles que
         llevan dentro. */
      --r-control:10px; --r-inset:12px; --r-card:18px;
      /* Movimiento. Al entrar se usa ease-out, al salir ease-in. */
      --motion:140ms;
      --ease-out:cubic-bezier(.22,.61,.36,1);
    }

    *{box-sizing:border-box}

    html{-webkit-text-size-adjust:100%}

    body{
      margin:0;
      min-height:100dvh;
      padding:var(--s5) var(--s4);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
      font-size:15px;
      line-height:1.5;
      color:var(--text);
      background:var(--ink);
      transition:background-color var(--motion) var(--ease-out);
      /* Mantiene el contenido lejos del notch y del indicador de inicio. */
      padding-left:max(var(--s4),env(safe-area-inset-left));
      padding-right:max(var(--s4),env(safe-area-inset-right));
      padding-bottom:max(var(--s5),env(safe-area-inset-bottom));
    }
    /* La página entera acepta archivos, igual que la ventana de la PC. Un
       rectángulo de soltar con su propio canto le robaba sitio a la lista, que
       es lo que se viene a mirar. */
    body.drag{background:var(--accent-deep)}

    /* -- escala tipográfica ------------------------------------------------ */

    h1{margin:0;font-size:clamp(22px,5vw,28px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
    p{margin:0}
    .muted{color:var(--text-muted)}
    /* Los tamaños, los porcentajes y los bytes dejan de bailar al actualizarse. */
    .tnum{font-variant-numeric:tabular-nums}

    /* Quien usa el teclado recibe el mismo anillo en todas partes, y solo lo ve
       esa persona. */
    :focus-visible{
      outline:2px solid var(--accent);
      outline-offset:2px;
      border-radius:var(--r-control);
    }

    .skip{
      position:absolute;left:var(--s4);top:calc(var(--s4) * -4);
      padding:var(--s2) var(--s3);border-radius:var(--r-control);
      background:var(--accent);color:var(--accent-ink);font-weight:600;
      text-decoration:none;transition:top var(--motion) var(--ease-out);
    }
    .skip:focus-visible{top:var(--s4)}

    /* Título que existe para el lector de pantalla: la tarjeta se explica sola
       a la vista, pero sin encabezado la sección no tiene nombre. */
    .sr{
      position:absolute;width:1px;height:1px;overflow:hidden;
      clip:rect(0 0 0 0);white-space:nowrap;
    }

    .icon{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.7;
      stroke-linecap:round;stroke-linejoin:round}

    /* -- disposición -------------------------------------------------------- */

    .wrap{width:min(1080px,100%);margin:auto}

    header{
      display:flex;align-items:center;justify-content:space-between;
      gap:var(--s4);margin:0 0 var(--s5);
    }
    .brand{display:flex;align-items:center;gap:var(--s3);min-width:0}
    .mark{width:36px;height:36px;flex-shrink:0}

    .badge{
      display:flex;align-items:center;gap:var(--s2);
      padding:var(--s2) var(--s3);border-radius:999px;
      background:var(--surface);border:1px solid var(--border);
      color:var(--text-muted);font-size:13px;white-space:nowrap;flex-shrink:0;
    }
    /* Punto plano. El estado se lee de la etiqueta que tiene al lado, no de un
       halo. */
    .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
    .badge[data-offline] .dot{background:var(--danger)}

    /* Una sola tarjeta: los archivos son la pantalla, no una sección de ella.
       Los filetes de la barra de herramientas y de la barra de estado llegan
       hasta el canto, así que el relleno lo pone cada franja. */
    .card{
      border:1px solid var(--border);border-radius:var(--r-card);
      background:var(--surface);overflow:hidden;
    }

    /* -- barra de herramientas ---------------------------------------------- */

    .toolbar{
      display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
      padding:var(--s4);border-bottom:1px solid var(--border);
    }
    /* El buscador ocupa el hueco que si no sería aire: es el control que más
       se agradece que sea ancho. En un celular se lleva su propia línea, porque
       comprimido entre dos botones no le queda sitio para lo que se escribió. */
    .search{
      display:flex;align-items:center;gap:var(--s2);
      flex:1 1 180px;min-width:0;min-height:40px;
      padding:0 var(--s3);border-radius:var(--r-control);
      background:var(--surface-muted);color:var(--text-muted);
      border:1px solid transparent;
      transition:border-color var(--motion) var(--ease-out);
    }
    /* El canto solo aparece con el foco, que es cuando hace falta saber dónde
       está el cursor. En reposo es un relleno dentro de una tarjeta, no otro
       rectángulo con borde. */
    .search:focus-within{border-color:var(--accent)}
    .search input{
      flex:1;min-width:0;border:0;outline:none;background:transparent;
      font:inherit;font-size:14px;color:var(--text);
    }
    .search input::placeholder{color:var(--text-muted)}
    .search input::-webkit-search-cancel-button{filter:grayscale(1)}
    /* En un celular se lleva la línea entera. El orden del DOM ya la deja donde
       toca: Subir arriba, el buscador debajo, y las preferencias al final. */
    @media(max-width:560px){.search{flex-basis:100%}}

    /* -- controles ---------------------------------------------------------- */

    button,.button{
      border:1px solid transparent;border-radius:var(--r-control);
      padding:var(--s2) var(--s3);cursor:pointer;
      font:inherit;font-weight:600;font-size:14px;
      text-decoration:none;display:inline-flex;align-items:center;
      justify-content:center;gap:var(--s2);min-height:40px;
      transition:background-color var(--motion) var(--ease-out),
                 border-color var(--motion) var(--ease-out),
                 color var(--motion) var(--ease-out),
                 transform var(--motion) var(--ease-out);
    }
    button:active,.button:active{transform:translateY(1px)}
    button:disabled{cursor:not-allowed;opacity:.5;transform:none}

    .primary{background:var(--accent);color:var(--accent-ink);padding-inline:var(--s4)}
    .primary:hover:not(:disabled){background:var(--accent-strong)}

    .secondary{background:transparent;border-color:var(--border-strong);color:var(--text)}
    .secondary:hover:not(:disabled){background:var(--surface-muted);border-color:var(--accent)}

    .danger{background:transparent;border-color:var(--border-strong);color:var(--danger)}
    .danger:hover:not(:disabled){border-color:var(--danger)}

    .quiet{background:transparent;color:var(--text-muted);min-height:36px;padding:var(--s2)}
    .quiet:hover:not(:disabled){color:var(--accent)}
    .quiet.del:hover:not(:disabled){color:var(--danger)}

    /* Orden. Un select nativo: el celular ya sabe presentarlo, y una lista
       hecha a mano no le gana a la del sistema en una pantalla táctil. El
       chevron es el mismo trazado que usa la ventana, encima del select y sin
       recibir el puntero, porque un select no admite hijos. */
    .sortBox{position:relative;display:flex;align-items:center}
    .sortBox .icon{
      position:absolute;right:var(--s2);width:16px;height:16px;
      color:var(--text-muted);pointer-events:none;
    }
    .sort{
      appearance:none;font:inherit;font-weight:600;font-size:14px;
      color:var(--text);background:transparent;
      border:1px solid var(--border-strong);border-radius:var(--r-control);
      padding:var(--s2) var(--s5) var(--s2) var(--s3);min-height:40px;cursor:pointer;
    }
    .sort option{background:var(--surface);color:var(--text)}

    /* Lista o cuadrícula: dos estados de una misma preferencia, así que van
       pegados dentro de un solo borde. */
    .views{display:flex;border:1px solid var(--border-strong);border-radius:var(--r-control)}
    .views button{
      border:0;border-radius:calc(var(--r-control) - 2px);background:transparent;
      color:var(--text-muted);min-height:38px;padding:var(--s2) var(--s3);
    }
    .views button[aria-pressed=true]{background:var(--accent-deep);color:var(--accent)}

    input[type=file]{
      position:absolute;width:1px;height:1px;overflow:hidden;
      clip:rect(0 0 0 0);white-space:nowrap;
    }

    /* -- casilla de selección ------------------------------------------------ */

    .check{
      appearance:none;margin:0;flex-shrink:0;
      width:18px;height:18px;border-radius:5px;cursor:pointer;
      border:1px solid var(--border-strong);background:transparent;
      transition:background-color var(--motion) var(--ease-out),
                 border-color var(--motion) var(--ease-out);
    }
    .check:checked{background:var(--accent);border-color:var(--accent)}
    /* La palomita se dibuja con dos bordes girados: un SVG por fila era un nodo
       más por archivo sin decir nada nuevo. */
    .check:checked::after{
      content:"";display:block;width:5px;height:9px;margin:1px auto 0;
      border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg);
    }

    /* -- lista --------------------------------------------------------------- */

    /* La cabecera y las filas comparten rejilla, celda por celda, incluida la
       del icono de tipo: si la cabecera se saltara esa columna, "Nombre"
       quedaría encima de los iconos y no de los nombres. En un celular el
       nombre es lo único que de verdad importa, así que las demás columnas se
       aprietan a su mínimo legible. */
    .listHead,.row{
      display:grid;align-items:center;gap:var(--s2);
      grid-template-columns:18px 20px minmax(0,1fr) 72px 40px;
      padding:var(--s2) var(--s4);
    }
    .listHead{
      color:var(--text-muted);font-size:12px;font-weight:600;
      border-bottom:1px solid var(--border);
    }
    .listHead .when,.row .when{display:none}
    .row + .row{border-top:1px solid var(--border)}
    .row{transition:background-color var(--motion) var(--ease-out)}
    /* La selección se tiñe con el azul profundo del logo, el mismo que marca el
       arrastre. No hace falta un segundo acento para decir "esto está
       elegido". */
    .row[data-selected]{background:var(--accent-deep)}
    .row .kind{color:var(--text-muted)}
    .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .size{color:var(--text-muted);font-size:13px}
    .acts{display:flex;gap:var(--s1);justify-content:flex-end}

    @media(min-width:560px){
      .listHead,.row{gap:var(--s3);grid-template-columns:18px 20px minmax(0,1fr) 84px 104px 40px}
      .listHead .when,.row .when{display:block;color:var(--text-muted);font-size:13px}
    }

    /* -- cuadrícula ---------------------------------------------------------- */

    .grid{
      display:grid;gap:var(--s3);padding:var(--s4);
      grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    }
    .tile{
      display:flex;flex-direction:column;gap:var(--s2);
      padding:var(--s2);border:1px solid var(--border);border-radius:var(--r-inset);
      background:var(--surface-muted);
      transition:background-color var(--motion) var(--ease-out),
                 border-color var(--motion) var(--ease-out);
    }
    .tile[data-selected]{background:var(--accent-deep);border-color:var(--accent)}
    .thumb{
      position:relative;aspect-ratio:1;border-radius:var(--r-control);overflow:hidden;
      background:var(--surface);display:flex;align-items:center;justify-content:center;
    }
    /* Las imágenes se pintan de verdad: buscar una foto por su nombre de
       archivo es justo lo que nadie sabe hacer. */
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .thumb .icon{width:34px;height:34px;color:var(--text-muted)}
    /* Encima de una foto, una casilla transparente con un borde fino
       desaparece: el relleno opaco es lo que la mantiene legible sobre
       cualquier imagen. */
    .thumb .check{position:absolute;top:var(--s1);left:var(--s1);background:var(--surface)}
    .thumb .check:checked{background:var(--accent)}
    .tile .name{font-size:13px}
    .tile .size{font-size:11px}
    .tile .acts{justify-content:space-between;align-items:center}

    /* -- barra de abajo ------------------------------------------------------ */

    /* La barra de estado y la de selección se sustituyen, no se apilan: una que
       apareciera empujaría la lista justo cuando se está tocando una fila.
       Pegada abajo, para que en una lista larga siga al alcance del pulgar. */
    .bottom{
      position:sticky;bottom:0;
      display:flex;align-items:center;gap:var(--s2);
      padding:var(--s2) var(--s4);min-height:52px;
      border-top:1px solid var(--border);background:var(--surface);
    }
    /* display:flex gana sobre el hidden del navegador, así que hay que decirlo. */
    .bottom[hidden]{display:none}
    .bottom .spacer{flex:1 1 auto}
    .count{color:var(--text-muted);font-size:13px;white-space:nowrap}
    /* En un celular la barra no tiene ancho para las tres etiquetas. La de
       descargar se cae: la flecha ya lo dice y el título la nombra. La de
       eliminar se queda porque cambia a "Confirmar" en la segunda pulsación,
       que es toda la confirmación que hay. */
    @media(max-width:560px){.bottom .label{display:none}}

    /* -- progreso ------------------------------------------------------------ */

    .progressBox{display:none;padding:var(--s3) var(--s4);border-bottom:1px solid var(--border)}
    .progressBox[data-active]{display:block}
    .bar{height:8px;border-radius:999px;background:var(--surface-muted);overflow:hidden}
    .bar>div{height:100%;width:0;background:var(--accent);transition:width var(--motion) linear}
    .progressMeta{
      display:flex;justify-content:space-between;gap:var(--s3);
      margin-top:var(--s2);color:var(--text-muted);font-size:13px;
    }
    #progressName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .status{min-height:0;font-size:14px}
    .status:not(:empty){padding:var(--s2) var(--s4);border-bottom:1px solid var(--border)}
    .status.ok{color:var(--accent)}
    .status.err{color:var(--danger)}

    /* -- estados vacíos ------------------------------------------------------ */

    .empty{
      display:flex;flex-direction:column;align-items:center;gap:var(--s2);
      text-align:center;color:var(--text-muted);padding:var(--s7) var(--s4);text-wrap:balance;
    }
    .empty .icon{width:36px;height:36px}
    .empty strong{color:var(--text);font-size:16px}

    /* Las filas fantasma copian la forma de una fila real, para que la lista no
       dé un salto cuando llega la primera petición. */
    .skeleton{height:52px;margin:var(--s2) var(--s4);border-radius:var(--r-inset);
      background:var(--surface-muted);animation:pulse 1.4s ease-in-out infinite}
    .skeleton:nth-child(2){animation-delay:.15s}
    .skeleton:nth-child(3){animation-delay:.3s}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

    .footer{
      margin:var(--s4) 0 var(--s1);text-align:center;
      color:var(--text-muted);font-size:12px;text-wrap:balance;
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
      }
    }
  </style>
</head>
<body>
<!-- Un solo juego de trazados para toda la página. Repetir el SVG en cada fila
     multiplicaba el mismo dibujo por archivo. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 16l4.5-4.5 4 4L16 12l4 4"/><circle cx="9" cy="9" r="1.4"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><path d="M3 6h12v12H3zM15 10l6-3v10l-6-3z"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24"><path d="M10 18V5l9-2v13"/><circle cx="7.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
  <symbol id="i-zip" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M11 5h1M11 8h1M11 11h1M11 14h1"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M8.5 13h7M8.5 16.5h5"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13h5l1.5 3h5L16 13h5M3 13l3-8h12l3 8v6H3z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
</svg>

<a class="skip" href="#main">Saltar al contenido</a>
<main class="wrap" id="main">
  <header>
    <div class="brand">
      <img class="mark" src="/icon-256.png" alt="" width="36" height="36">
      <h1>FileFly</h1>
    </div>
    <p class="badge" id="conn" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="connText">Conectado</span></p>
  </header>

  <section class="card" aria-labelledby="filesTitle">
    <h2 id="filesTitle" class="sr">Archivos compartidos</h2>

    <div class="toolbar">
      <label for="filesInput" class="button primary">
        <svg class="icon" aria-hidden="true"><use href="#i-up"/></svg>Subir
      </label>
      <input id="filesInput" type="file" multiple>

      <!-- Filtra por nombre mientras se escribe. No pregunta al servidor: la
           carpeta entera ya está en memoria, y una petición por tecla sería
           trabajo de red para un indexOf. -->
      <div class="search">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Buscar por nombre" aria-label="Buscar archivos por nombre" autocomplete="off">
      </div>

      <div class="sortBox">
        <select id="sort" class="sort" aria-label="Ordenar archivos">
          <option value="recent">Recientes</option>
          <option value="name">Nombre</option>
          <option value="size">Tamaño</option>
        </select>
        <svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg>
      </div>

      <div class="views" role="group" aria-label="Forma de ver los archivos">
        <button type="button" id="viewList" aria-pressed="true" title="Ver como lista">
          <svg class="icon" aria-hidden="true"><use href="#i-list"/></svg>
        </button>
        <button type="button" id="viewGrid" aria-pressed="false" title="Ver como cuadrícula">
          <svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg>
        </button>
      </div>

      <button type="button" id="refreshBtn" class="quiet" title="Actualizar">
        <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>
      </button>
    </div>

    <div id="progressBox" class="progressBox">
      <div class="bar">
        <div id="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      </div>
      <div class="progressMeta">
        <span id="progressName">Preparando</span>
        <span id="progressPct" class="tnum">0%</span>
      </div>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div id="files" aria-busy="true">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>

    <div class="bottom" id="bottom"></div>
  </section>

  <p class="footer">Todo viaja por tu red local. Nada sale a internet.</p>
</main>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const token = params.get("token") || "";

  const $ = s => document.querySelector(s);
  const els = {
    input: $("#filesInput"),
    files: $("#files"),
    bottom: $("#bottom"),
    search: $("#search"),
    sort: $("#sort"),
    viewList: $("#viewList"),
    viewGrid: $("#viewGrid"),
    refresh: $("#refreshBtn"),
    conn: $("#conn"),
    connText: $("#connText"),
    status: $("#status"),
    box: $("#progressBox"),
    bar: $("#progressBar"),
    pct: $("#progressPct"),
    name: $("#progressName")
  };

  // Todo lo que se ve sale de estas cuatro variables. La lista es lo que dijo
  // el servidor; el orden, la vista y la selección son de quien mira.
  let files = [];
  let view = "list";
  let selected = new Set();
  let loaded = false;

  const api = path => {
    const sep = path.includes("?") ? "&" : "?";
    return path + sep + "token=" + encodeURIComponent(token);
  };

  const downloadUrl = name => api("/api/download?name=" + encodeURIComponent(name));

  // La insignia decía "Conectado" desde que se pintaba la página y no volvía a
  // mirar. Si FileFly se cierra en la PC, la pestaña abierta seguía afirmando
  // que había conexión mientras todo lo demás fallaba.
  function setConnected(ok){
    els.conn.toggleAttribute("data-offline", !ok);
    els.connText.textContent = ok ? "Conectado" : "Sin conexión";
  }

  // Un solo punto por el que pasan todas las peticiones: el estado de la
  // insignia se deduce de si el servidor respondió, no de cada llamada.
  async function apiFetch(path, init){
    try{
      const r = await fetch(api(path), init);
      setConnected(true);
      return r;
    }catch(err){
      setConnected(false);
      throw err;
    }
  }

  function formatBytes(bytes){
    if (!bytes) return "0 B";
    const units = ["B","KB","MB","GB","TB"];
    const i = Math.min(Math.floor(Math.log(bytes)/Math.log(1024)), units.length-1);
    return (bytes/Math.pow(1024,i)).toFixed(i ? 1 : 0) + " " + units[i];
  }

  // La misma forma corta que usa la ventana de la PC: hoy es una hora, ayer
  // lleva su nombre y lo anterior es una fecha. Ver formatWhen en theme.dart.
  const MONTHS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

  function formatWhen(iso){
    const at = new Date(iso);
    if (isNaN(at)) return "";
    const day = new Date(at.getFullYear(), at.getMonth(), at.getDate());
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const elapsed = Math.round((today - day) / 86400000);
    const time = String(at.getHours()).padStart(2,"0") + ":" + String(at.getMinutes()).padStart(2,"0");

    if (elapsed === 0) return time;
    if (elapsed === 1) return "Ayer " + time;
    const date = at.getDate() + " " + MONTHS[at.getMonth()];
    return day.getFullYear() === today.getFullYear() ? date : date + " " + at.getFullYear();
  }

  const IMAGE_EXTENSIONS = ["png","jpg","jpeg","gif","webp","avif","bmp","svg","heic"];
  // Solo estas se pueden pedir en línea: el servidor sirve el resto como
  // adjunto a propósito. Ver imageContentType en file_server.dart.
  const INLINE_EXTENSIONS = ["png","jpg","jpeg","gif","webp","avif","bmp"];
  const KINDS = [
    ["i-image", IMAGE_EXTENSIONS],
    ["i-video", ["mp4","mkv","mov","avi","webm","m4v"]],
    ["i-audio", ["mp3","wav","flac","ogg","m4a","aac"]],
    ["i-zip", ["zip","rar","7z","tar","gz","xz","zst"]],
    ["i-doc", ["pdf","txt","md","doc","docx","odt","rtf","csv","xlsx"]]
  ];

  const extensionOf = name => (name.split(".").pop() || "").toLowerCase();

  function iconFor(name){
    const ext = extensionOf(name);
    for (const [id, list] of KINDS){
      if (list.includes(ext)) return id;
    }
    return "i-file";
  }

  function setStatus(text, cls=""){
    els.status.textContent = text;
    els.status.className = "status " + cls;
  }

  function setProgress(pct){
    els.bar.style.width = pct + "%";
    els.bar.setAttribute("aria-valuenow", pct);
    els.pct.textContent = pct + "%";
  }

  const query = () => els.search.value.trim().toLowerCase();

  // Los archivos que se ven: primero el filtro del buscador, después el orden.
  // Buscar no toca la selección: quien elige tres archivos, escribe para
  // encontrar el cuarto y lo marca, espera irse con cuatro.
  function visible(){
    const needle = query();
    const list = needle ? files.filter(f => f.name.toLowerCase().includes(needle)) : files.slice();
    if (els.sort.value === "name") list.sort((a,b) => a.name.localeCompare(b.name, "es"));
    else if (els.sort.value === "size") list.sort((a,b) => b.size - a.size);
    else list.sort((a,b) => new Date(b.modified) - new Date(a.modified));
    return list;
  }

  function icon(id, cls="icon"){
    return `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
  }

  const escape = text => text.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  function toggle(name){
    if (!selected.delete(name)) selected.add(name);
    render();
  }

  function renderEmpty(){
    els.files.innerHTML =
      '<div class="empty">' + icon("i-inbox") +
      "<strong>Todavía no hay archivos</strong>" +
      "<span>Toca Subir para mandar algo desde este celular.</span></div>";
  }

  // Distinto de la carpeta vacía: aquí hay archivos, solo que ninguno se llama
  // así, y la salida es borrar lo escrito.
  function renderNoMatch(){
    els.files.innerHTML =
      '<div class="empty">' + icon("i-search") +
      `<strong>Ningún archivo se llama "${escape(els.search.value.trim())}"</strong>` +
      '<button type="button" class="secondary" id="clearSearch">Limpiar la búsqueda</button></div>';
    $("#clearSearch").onclick = () => { els.search.value = ""; render(); };
  }

  function renderList(list){
    const rows = list.map(f => {
      const on = selected.has(f.name);
      const safe = escape(f.name);
      return '<div class="row"' + (on ? " data-selected" : "") + ">" +
        `<input class="check" type="checkbox" data-name="${safe}"${on ? " checked" : ""} aria-label="Seleccionar ${safe}">` +
        icon(iconFor(f.name), "icon kind") +
        `<div class="name" title="${safe}">${safe}</div>` +
        `<div class="size tnum">${formatBytes(f.size)}</div>` +
        `<div class="when tnum">${formatWhen(f.modified)}</div>` +
        '<div class="acts">' +
          `<a class="button quiet" href="${downloadUrl(f.name)}" download title="Descargar ${safe}">${icon("i-down")}</a>` +
        "</div></div>";
    }).join("");

    els.files.innerHTML =
      '<div class="listHead">' +
        `<input class="check" type="checkbox" id="checkAll"${list.every(f => selected.has(f.name)) ? " checked" : ""} aria-label="Seleccionar todo">` +
        "<div></div><div>Nombre</div><div>Tamaño</div><div class=\"when\">Fecha</div><div></div>" +
      "</div>" + rows;
  }

  function renderGrid(list){
    els.files.innerHTML = '<div class="grid">' + list.map(f => {
      const on = selected.has(f.name);
      const safe = escape(f.name);
      const inline = INLINE_EXTENSIONS.includes(extensionOf(f.name));
      const thumb = inline
        ? `<img src="${downloadUrl(f.name)}&inline=1" alt="" loading="lazy">`
        : icon(iconFor(f.name));
      return '<div class="tile"' + (on ? " data-selected" : "") + ">" +
        `<div class="thumb">${thumb}` +
          `<input class="check" type="checkbox" data-name="${safe}"${on ? " checked" : ""} aria-label="Seleccionar ${safe}">` +
        "</div>" +
        `<div class="name" title="${safe}">${safe}</div>` +
        '<div class="acts">' +
          `<span class="size tnum">${formatBytes(f.size)}</span>` +
          `<a class="button quiet" href="${downloadUrl(f.name)}" download title="Descargar ${safe}">${icon("i-down")}</a>` +
        "</div></div>";
    }).join("") + "</div>";
  }

  // La barra de estado y la de selección se sustituyen, así que cualquier
  // cambio de selección desarma sola la confirmación de borrado.
  function renderBottom(list){
    els.bottom.hidden = false;

    if (!selected.size){
      const bytes = list.reduce((sum, f) => sum + f.size, 0);
      // Con un filtro puesto, la cuenta a secas haría pensar que desaparecieron
      // archivos.
      const count = list.length === files.length
        ? (files.length === 1 ? "1 archivo" : files.length + " archivos")
        : `${list.length} de ${files.length}`;
      els.bottom.innerHTML = `<span class="spacer"></span><span class="count tnum">${count} · ${formatBytes(bytes)}</span>`;
      return;
    }

    els.bottom.innerHTML =
      `<span class="count">${selected.size === 1 ? "1 seleccionado" : selected.size + " seleccionados"}</span>` +
      '<span class="spacer"></span>' +
      '<button type="button" class="quiet" id="clearSel">Quitar</button>' +
      `<button type="button" class="secondary" id="downloadSel" title="Descargar">${icon("i-down")}<span class="label">Descargar</span></button>` +
      `<button type="button" class="danger" id="deleteSel">${icon("i-trash")}<span>Eliminar</span></button>`;

    $("#clearSel").onclick = () => { selected = new Set(); render(); };
    $("#downloadSel").onclick = downloadSelected;
    armDelete($("#deleteSel"));
  }

  // Dos pulsaciones en vez de confirm(): un diálogo modal bloquea la página y
  // se lee mal en un celular. El botón se pregunta a sí mismo y se desarma a
  // los pocos segundos si la segunda pulsación no llega.
  function armDelete(button){
    const label = button.querySelector("span");
    let timer = 0;

    const disarm = () => {
      clearTimeout(timer);
      timer = 0;
      label.textContent = "Eliminar";
    };

    button.onclick = () => {
      if (!timer){
        label.textContent = "Confirmar";
        timer = setTimeout(disarm, 4000);
        return;
      }
      disarm();
      deleteFiles([...selected]);
    };
  }

  function render(){
    if (!loaded) return;
    const list = visible();

    els.files.setAttribute("aria-busy", "false");
    if (list.length) view === "grid" ? renderGrid(list) : renderList(list);
    else if (query()) renderNoMatch();
    else renderEmpty();

    renderBottom(list);
  }

  // Un solo oyente para toda la lista: enganchar uno por fila multiplicaba los
  // manejadores por archivo y había que volver a colgarlos en cada repintado.
  els.files.addEventListener("click", e => {
    const check = e.target.closest(".check");
    if (check){
      if (check.id === "checkAll"){
        // Marca o desmarca lo que se está viendo, no la carpeta entera: con un
        // filtro puesto, arrastrar archivos ocultos sería una trampa, y el
        // botón de eliminar está justo debajo.
        const shown = visible().map(f => f.name);
        const every = shown.every(name => selected.has(name));
        shown.forEach(name => every ? selected.delete(name) : selected.add(name));
        render();
      } else {
        toggle(check.dataset.name);
      }
    }
  });

  async function loadFiles(){
    let r;
    try{
      r = await apiFetch("/api/files");
    }catch{
      loaded = true;
      els.files.setAttribute("aria-busy", "false");
      els.files.innerHTML = '<div class="empty">' + icon("i-inbox") +
        "<strong>Sin conexión con la PC</strong>" +
        "<span>Revisa que ambos sigan en la misma red Wi‑Fi.</span></div>";
      els.bottom.hidden = true;
      return;
    }

    if (!r.ok) {
      loaded = true;
      els.files.setAttribute("aria-busy", "false");
      els.files.innerHTML = '<div class="empty">' + icon("i-inbox") +
        "<strong>No se pudo abrir la carpeta compartida</strong>" +
        "<span>Comprueba que FileFly siga abierto en la PC.</span></div>";
      els.bottom.hidden = true;
      return;
    }

    const data = await r.json();
    files = data.files || [];
    loaded = true;
    // Un archivo que ya no está no puede seguir seleccionado: la barra de abajo
    // contaría acciones sobre algo que se borró desde la PC.
    const alive = new Set(files.map(f => f.name));
    selected = new Set([...selected].filter(name => alive.has(name)));
    render();
  }

  async function deleteFiles(names){
    if (!names.length) return;

    let failed = 0;
    for (const name of names){
      try{
        const res = await apiFetch("/api/file?name=" + encodeURIComponent(name), {method:"DELETE"});
        if (!res.ok) failed++;
      }catch{
        failed++;
      }
    }

    selected = new Set();
    const done = names.length - failed;
    setStatus(
      failed
        ? `No se pudieron eliminar ${failed} de ${names.length}`
        : done === 1 ? `Se eliminó ${names[0]}` : `Se eliminaron ${done} archivos`,
      failed ? "err" : "ok"
    );
    await loadFiles();
  }

  // Un anclaje por archivo, separados en el tiempo. El navegador pide permiso
  // para bajar varios y algunos cortan la ráfaga.
  // ponytail: sirve para un puñado de archivos; si hace falta bajar carpetas
  // enteras, la salida es un endpoint que devuelva un zip.
  function downloadSelected(){
    const names = [...selected];
    names.forEach((name, i) => {
      setTimeout(() => {
        const a = document.createElement("a");
        a.href = downloadUrl(name);
        a.download = name;
        document.body.append(a);
        a.click();
        a.remove();
      }, i * 400);
    });
    setStatus(names.length === 1 ? "Descargando" : `Descargando ${names.length} archivos`, "ok");
  }

  function uploadOne(file, index, total){
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", api("/api/upload"));
      xhr.setRequestHeader("X-Filename", encodeURIComponent(file.name));
      xhr.setRequestHeader("Content-Type", "application/octet-stream");

      els.box.dataset.active = "";
      els.name.textContent = total > 1 ? `${index + 1}/${total} · ${file.name}` : file.name;
      setProgress(0);

      xhr.upload.onprogress = e => {
        if (!e.lengthComputable) return;
        setProgress(Math.round(e.loaded / e.total * 100));
      };

      xhr.onload = () => {
        setConnected(true);
        if (xhr.status >= 200 && xhr.status < 300){
          setProgress(100);
          resolve();
        } else {
          reject(new Error("No se pudo enviar " + file.name));
        }
      };

      xhr.onerror = () => {
        setConnected(false);
        reject(new Error("Sin conexión con la PC. Revisa el Wi‑Fi."));
      };
      xhr.send(file);
    });
  }

  async function upload(filesLike){
    const chosen = Array.from(filesLike || []);
    if (!chosen.length) return;

    setStatus("");
    try{
      for (let i=0;i<chosen.length;i++){
        await uploadOne(chosen[i], i, chosen.length);
      }
      setStatus(chosen.length === 1 ? "Archivo enviado" : chosen.length + " archivos enviados", "ok");
      els.input.value = "";
      await loadFiles();
    }catch(err){
      setStatus(err.message || "El envío no pudo completarse.", "err");
    }finally{
      delete els.box.dataset.active;
    }
  }

  els.input.addEventListener("change", e => upload(e.target.files));
  els.refresh.addEventListener("click", loadFiles);
  els.sort.addEventListener("change", render);
  // `input` y no `change`: filtra mientras se escribe, y también cuando la
  // cruz del propio campo lo vacía.
  els.search.addEventListener("input", render);

  function setView(next){
    view = next;
    els.viewList.setAttribute("aria-pressed", String(next === "list"));
    els.viewGrid.setAttribute("aria-pressed", String(next === "grid"));
    render();
  }

  els.viewList.addEventListener("click", () => setView("list"));
  els.viewGrid.addEventListener("click", () => setView("grid"));

  // La página entera acepta archivos, igual que la ventana de la PC. Un
  // navegador de escritorio abriría el archivo soltado si nadie lo impide.
  ["dragenter","dragover"].forEach(type => {
    addEventListener(type, e => {
      e.preventDefault();
      document.body.classList.add("drag");
    });
  });

  ["dragleave","drop"].forEach(type => {
    addEventListener(type, e => {
      e.preventDefault();
      document.body.classList.remove("drag");
    });
  });

  addEventListener("drop", e => upload(e.dataTransfer.files));

  // Volver a la pestaña es el momento en que el estado mostrado tiene más
  // probabilidad de estar viejo: el celular estuvo minutos bloqueado y la PC
  // pudo apagarse. Es una comprobación por regreso, no un sondeo.
  addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") loadFiles();
  });

  loadFiles().catch(err => {
    console.error("files:", err);
    loaded = true;
    els.files.setAttribute("aria-busy", "false");
    els.files.innerHTML = '<div class="empty">' + icon("i-inbox") +
      "<strong>No se pudo leer la lista</strong><span>Toca Actualizar.</span></div>";
  });
})();
</script>
</body>
</html>
